name: Playwright Tests

on:
  push:
    branches:
      - dev  
  pull_request:
    branches:
      - dev

jobs:
  playwright-test:
    timeout-minutes: 60  # Prevent hanging jobs
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT_URL: https://vcst-qa-storefront.govirto.com
      BASE_URL: https://vcst-qa.govirto.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Password3
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}  # Store sensitive tokens as GitHub Secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Use latest version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright pytest-html

              
      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps

      - name: Run your tests
        run: pytest --tracing=retain-on-failure
      
      - name: Run Playwright Tests
        run: |
          echo "Running tests against ${{ env.ENVIRONMENT_URL }}"
          pytest tests/ --browser chromium --html=report.html --self-contained-html -v
        continue-on-error: true


      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            report.html
          retention-days: 7

      - name: Upload Test Screenshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/     
          retention-days: 7

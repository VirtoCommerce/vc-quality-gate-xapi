name: Playwright Python Tests

on:
  push:
    branches:
      - dev  
  pull_request:
    branches:
      - dev

env:
  ENVIRONMENT_URL: "https://vcst-qa-storefront.govirto.com"
  BASE_URL: "${{ env.ENVIRONMENT_URL }}"
  GRAPHQL_ENDPOINT: "${{ env.BASE_URL }}/graphql"
  ADMIN_USER: "admin"
  ADMIN_PASS: "Password3"
  AUTH_TOKEN: "Bearer ${{ secrets.ADMIN_TOKEN }}"

jobs:
  test:
    timeout-minutes: 60  # Add timeout to prevent hanging jobs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'  # Enable pip caching for faster installations

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright
          playwright install --with-deps chromium  # Install only Chromium to save time

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ env.ENVIRONMENT_URL }}
          GRAPHQL_ENDPOINT: ${{ env.GRAPHQL_ENDPOINT }}  # Fixed to use the correct env variable
          ADMIN_USERNAME: ${{ env.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASS }}
          ADMIN_TOKEN: ${{ env.AUTH_TOKEN }}
        run: |
          pytest --headless --browser chromium --html=report.html --self-contained-html
        continue-on-error: true  # Continue to upload report even if tests fail

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            report.html
            test-results/  # Include test results directory for debugging
          retention-days: 7

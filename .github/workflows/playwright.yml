name: Playwright Tests

on:
  push:
    branches:
      - dev  
  pull_request:
    branches:
      - dev

jobs:
  playwright-test:
    timeout-minutes: 60  # Prevent hanging jobs
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT_URL: https://vcst-qa-storefront.govirto.com
      BASE_URL: https://vcst-qa.govirto.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Password3
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}  # Store sensitive tokens as GitHub Secrets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Use latest version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright
          playwright install --with-deps  # Ensure all dependencies are installed

      - name: Run Playwright with Debugging
        run: pytest --browser chromium --verbose
        env:
           PWDEBUG: 1  # Enables detailed Playwright debugging logs
           
      - name: Run Playwright Tests in Headed Mode (Debugging)
        run: pytest --browser chromium --headed

      - name: Run Authentication Tests
        run: |
          echo "Running tests against ${{ env.ENVIRONMENT_URL }}"
          pytest tests/test_auth.py -v

      - name: Run Playwright Tests
        run: |
          pytest --browser chromium --html=report.html --self-contained-html
        continue-on-error: true  # Continue to upload reports even if tests fail

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            report.html
          retention-days: 7
